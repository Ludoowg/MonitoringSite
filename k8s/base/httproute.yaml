apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: monitoring-site-routing
spec:
  parentRefs:
  - name: nginx-gateway

  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api
    backendRefs:
    - name: backend-service
      port: 3000

  - matches:    
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: frontend-service
      port: 80