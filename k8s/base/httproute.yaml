apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: monitoring-site-routing
  annotations:
    argocd.argoproj.io/sync-wave: '3'

spec:
  parentRefs:
  - name: nginx-gateway

  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api
    backendRefs:
    - name: backend-service-active
      port: 3000

  - matches:    
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: frontend-service-active
      port: 80