apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: backend

spec:
  replicas: 1

  template:
    spec:
      containers:
      - name: backend
        resources:
          requests: 
            cpu: "25m"
            memory: "64Mi"
          limits:
            cpu: "250m"
            memory: "512Mi"
