apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: frontend

spec:
  replicas: 1

  template:
    spec:
      containers:
      - name: frontend
        resources:
          requests: 
            cpu: "20m"
            memory: "64Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"