apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend

spec:
  template:
    spec:
      containers:
      - name: backend
        image: ludoowg/monitoring-site-backend:3ca7f79ef12a80bcb8a36be1dedc96f0643bbe45
        resources:
          requests: 
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

